repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format fix
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy src/manashelper
        language: system
        pass_filenames: false
        types: [python]
