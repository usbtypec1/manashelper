services:

  db:
    image: postgres:18-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_DB: ${DATASOURCE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: