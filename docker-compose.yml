services:

  db:
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_DB: ${DATASOURCE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: usbtypec1/manashelper:${VERSION}
    container_name: app
    ports:
      - "${SERVER_PORT}:8080"
    restart: always
    env_file:
      - .env

volumes:
  postgres_data: