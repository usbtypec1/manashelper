[project]
name = "manashelper"
version = "0.1.0"
description = "Telegram bot for Manas University students: timetable, OBIS integration, cafeteria menu."
authors = [
    { name = "ebaktybekuulu", email = "eldos.baktybekov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.19.2",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "dishka>=1.10.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]

[[tool.mypy.overrides]]
module = "aiogram.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
