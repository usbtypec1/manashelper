openapi: 3.1.0
info:
  title: Manashelper achievements
  version: 1.2.0
servers:
  - url: https://bot.example.com
paths:
  /api/gamification/me:
    get:
      operationId: getMyAchievements
      description: Reads cached personal progress; never calls OBIS synchronously.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Localized personal progress and rank; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { description: Invalid or expired initData; reopen the Mini App. }
        '403': { description: Signed user is not registered or achievements are disabled for this user. }
  /api/gamification/leaderboard:
    get:
      operationId: getAchievementLeaderboard
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: All enabled participants with at least one visible award. Equal scores share competition ranks.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [full_name, score, rank, is_self, achievements]
                      properties:
                        full_name: { type: string }
                        score: { type: integer, minimum: 1 }
                        rank: { type: integer, minimum: 1 }
                        is_self: { type: boolean }
                        achievements:
                          type: array
                          description: Visible earned awards, localized for the viewer.
                          items:
                            type: object
                            additionalProperties: false
                            required: [key, name, description, earned_at]
                            properties:
                              key: { type: string }
                              name: { type: string }
                              description: { type: string }
                              earned_at: { type: string, format: date-time }
        '401': { description: Invalid or expired initData. }
        '403': { description: Signed user is not registered or achievements are disabled for this user. }
  /api/admin/achievements:
    get:
      operationId: listAdminAchievements
      description: Lists all catalog achievements for an authorized Mini App administrator.
      security: [{ TelegramInitData: [] }]
      responses:
        '200':
          description: Catalog with localized defaults and saved display overrides.
          content:
            application/json:
              schema:
                type: object
                required: [achievements]
                properties:
                  achievements:
                    type: array
                    items:
                      type: object
                      required: [key, emoji, default_name, custom_name, hidden]
                      properties:
                        key: { type: string }
                        emoji: { type: string }
                        default_name: { type: string }
                        custom_name: { type: [string, 'null'] }
                        hidden: { type: boolean }
        '401': { description: Invalid or expired initData. }
        '403': { description: Admin access denied. }
  /api/admin/achievements/{key}:
    put:
      operationId: setAchievementDisplay
      description: Sets the display of a catalog achievement. Hidden awards are excluded from collections and scores.
      security: [{ TelegramInitData: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementDisplay' }
      responses:
        '200':
          description: The committed display settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementDisplay' }
        '400': { description: Invalid display settings. }
        '401': { description: Invalid or expired initData. }
        '403': { description: Admin access denied. }
        '404': { description: Unknown achievement key. }
  /api/admin/achievements/{key}/grants/{id}:
    put:
      operationId: grantAchievement
      description: Grants one achievement to a recipient. Repeating a grant preserves the original award.
      security: [{ TelegramInitData: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - name: id
          in: path
          required: true
          description: Positive Telegram user ID as a decimal string.
          schema: { type: string }
      responses:
        '200':
          description: New or existing award.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [granted, already_granted] }
        '400': { description: Invalid Telegram user ID. }
        '401': { description: Invalid or expired initData. }
        '403': { description: Admin access denied. }
        '404': { description: Unknown achievement or recipient. }
        '409': { description: The recipient is blocked or has achievements disabled. }
    delete:
      operationId: revokeAchievement
      description: Revokes an award and cancels its pending notification. A later manual grant can restore the award.
      security: [{ TelegramInitData: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Revoked or already absent award.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [revoked, not_awarded] }
        '400': { description: Invalid Telegram user ID. }
        '401': { description: Invalid or expired initData. }
        '403': { description: Admin access denied. }
        '404': { description: Unknown achievement or recipient. }
  /telegram/webhook:
    post:
      operationId: receiveTelegramUpdate
      security: [{ TelegramWebhookSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [update_id]
              properties:
                update_id: { type: integer }
              additionalProperties: true
      responses:
        '200': { description: Handler and receipt committed, or an already completed duplicate. }
        '400': { description: Malformed Telegram Update. }
        '401': { description: Missing or incorrect webhook secret. }
        '413': { description: Body exceeds one MiB. }
        '500': { description: Handler or commit failed; Telegram should retry. }
        '503': { description: The same update is still being processed; Telegram should retry. }
components:
  securitySchemes:
    TelegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: 'tma <raw Telegram WebApp initData>; valid for one hour.'
    TelegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
  schemas:
    AchievementDisplay:
      type: object
      additionalProperties: false
      required: [custom_name, hidden]
      properties:
        custom_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
          description: A single-line name shared across languages. Null restores localized names.
        hidden: { type: boolean }
    Profile:
      type: object
      required: [score, total, rank, achievements, locale, theme, ui]
      properties:
        score: { type: integer, minimum: 0, description: Visible earned achievements. }
        total: { type: integer, minimum: 0, description: Visible catalog achievements. }
        rank: { type: [integer, 'null'], minimum: 1 }
        locale: { type: string, enum: [en, ru, ky, tr, zh] }
        theme: { type: string, enum: [basic, halloween, pickme, deadinside, gta_vi] }
        ui: { type: object, additionalProperties: { type: string } }
        achievements:
          type: array
          items:
            type: object
            required: [key, emoji, name, description, current, target, earned_at, available, blocked_reason]
            properties:
              key: { type: string }
              emoji: { type: string }
              name: { type: string }
              description: { type: string }
              current: { type: number, minimum: 0 }
              target: { type: number, exclusiveMinimum: 0 }
              earned_at: { type: [string, 'null'], format: date-time }
              available: { type: boolean }
              blocked_reason: { type: [string, 'null'], enum: [source, baseline, null] }
