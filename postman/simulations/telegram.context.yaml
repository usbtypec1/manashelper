purpose:
  stands_in_for: Telegram Bot API sendMessage/sendPhoto/sendVideo/sendMediaGroup delivery, editMessageReplyMarkup and answerCallbackQuery responses.
  unblocks: Local verification of aiogram serialization and persistent delivery opt-out without notifying real users.
assumptions:
  - id: photo-and-keyboard-contract
    status: supported
    claim: A cached photo file ID can be sent with an inline keyboard whose buttons each select URL or callback_data.
    reason: The installed aiogram method/type schemas mirror the published Telegram contract; the local HTTP run exercised actual client serialization.
    verification: On 2026-10-30, the real aiohttp aiogram client sent sendPhoto and sendMessage through this simulation. The test inspected encoded photo, caption, URL and callback fields. This does not validate a file ID against live Telegram storage.
    source: https://core.telegram.org/bots/api#sendphoto; https://core.telegram.org/bots/api#inlinekeyboardbutton; tests/modules/broadcast/test_telegram_http_delivery.py
    updated_at: "2026-10-30"
  - id: permanent-recipient-error-strings
    status: unknown
    claim: Blocked/deactivated-user and missing-chat descriptions consistently identify recipients that cannot receive future messages without renewed interaction.
    reason: The stand-in models known Telegram error descriptions. Its responses verify caller behavior, not completeness or stability of real Telegram error text.
    verification: On 2026-10-30, modeled 403 blocked, 403 deactivated and 400 chat-not-found responses set the database flag. A repeat send to each flagged user produced no additional HTTP request. No live errors were induced.
    source: postman/mocks/telegram/default.js; src/manashelper/platform/telegram/delivery.py; tests/modules/broadcast/test_telegram_http_delivery.py
    updated_at: "2026-10-30"
  - id: temporary-and-content-error-eligibility
    status: supported
    claim: In the modeled rate-limit, server-failure and malformed-content responses, the caller preserves recipient eligibility.
    reason: The real client parsed 429 with retry_after, 500 and 400 entity-parse failures; application state stayed enabled for all three users.
    verification: On 2026-10-30, the HTTP simulation test asserted bot_stopped remained false for those synthetic responses. The mock does not establish real error frequency or recovery time.
    source: tests/modules/broadcast/test_telegram_http_delivery.py; https://core.telegram.org/bots/api#responseparameters
    updated_at: "2026-10-30"
  - id: ui-flow-commit-and-delivery-boundary
    status: supported
    claim: In the modeled HTTP 500 and partial inline attachment failures, UI state remains persisted and the caller does not automatically resend the same update.
    reason: The real aiogram HTTP client traversed the coordinator and PostgreSQL scopes; duplicate events produced no additional HTTP calls, while an explicit restore delivered the current input step.
    verification: On 2026-11-01, tests/modules/ui_flows/test_telegram_http.py exercised send success, server failure, blocked recipient and send-success/edit-failure. State and unknown/failed/sent delivery rows were asserted; the simulation request log confirmed sendMessage and editMessageReplyMarkup paths. Five HTTP tests passed including the existing broadcast regression. No live Telegram requests were made.
    source: tests/modules/ui_flows/test_telegram_http.py; src/manashelper/modules/ui_flows/presentation/coordinator.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-01"
  - id: ui-menu-feature-handoff-caller
    status: supported
    claim: In the modeled successful Settings handoff, the caller sends the runtime menu and then the existing feature keyboard once, and records legacy ownership.
    reason: The real aiogram aiohttp client, coordinator, feature entry point and PostgreSQL scopes ran together. The mock request log confirmed the sendMessage path and the caller inspected the serialized settings keyboard.
    verification: On 2026-11-01, six HTTP tests passed against the local simulation, including the new test_real_http_handoff_to_settings_is_not_repeated and the broadcast regression. Repeating the handoff update produced no extra HTTP request; delivery became sent and the metadata owner became legacy. No live Telegram was contacted; real client display remains a release check. Fingerprint ui-flow-menu-handoff-2026-11-01.
    source: tests/modules/ui_flows/test_telegram_http.py; src/manashelper/modules/ui_flows/presentation/features.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-01"
  - id: ui-survey-return-caller
    status: supported
    claim: In the modeled successful survey completion, the caller saves one response and opens one runtime menu; replaying the final button sends no second completion message.
    reason: The real aiohttp aiogram client traversed the survey coordinator and PostgreSQL transactions, using the existing local Telegram stand-in. Its request log and persisted response/location were inspected.
    verification: On 2026-11-01, seven HTTP tests passed including the survey return, prior UI delivery failures/handoff and broadcast regression. The short survey path sent four messages, finished with the main-menu keyboard and runtime owner, and replayed its final callback without another message. No live Telegram or real users were contacted. Fingerprint ui-survey-return-2026-11-01.
    source: tests/modules/ui_flows/test_telegram_http.py; src/manashelper/modules/ui_flows/presentation/coordinator.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-01"
  - id: remove-reply-then-attach-inline-client-behavior
    status: contradicted
    claim: Every supported Telegram client removes the old reply keyboard when the bot sends ReplyKeyboardRemove and then attaches inline buttons to that same new message.
    reason: The original stand-in wrongly allowed editing a ReplyKeyboardRemove message. The live Telegram Bot API rejects the second operation, so the proposed sequence cannot deliver its inline keyboard.
    verification: On 2026-11-01, the initial simulated HTTP run accepted sendMessage with remove_keyboard=true followed by editMessageReplyMarkup. Later, a controlled message to the configured private test administrator reproduced Bad Request - message can't be edited against live Telegram; the probe message was removed. The mock now enforces the restriction. The sender uses two sendMessage calls and was accepted by live Telegram. Historical passing simulation results did not establish this editing contract.
    source: https://core.telegram.org/bots/api#editmessagereplymarkup; tests/modules/ui_flows/test_telegram_http.py; features/ui_flows/TELEGRAM.md
    updated_at: "2026-11-01"
  - id: inline-direct-send-caller
    status: supported
    claim: The caller can remove a reply keyboard with one message and send the inline buttons directly on a separate localized message, recording the button message ID for callbacks.
    reason: The corrected production send_screen function completed both requests against the live test bot; its returned ID matched the second response. The local stand-in independently rejects the old edit request.
    verification: On 2026-11-01, the live probe used only the configured test bot and private administrator, then removed its two probe messages. Nine local HTTP tests passed including rejected ReplyKeyboardRemove edits, partial inline-send failure, explicit restore, no automatic retry, survey return/rollout and broadcast delivery. Full manual client interaction remains separate from server acceptance. Fingerprint inline-direct-send-2026-11-01.
    source: https://core.telegram.org/bots/api#updating-messages; src/manashelper/modules/ui_flows/presentation/sender.py; tests/modules/ui_flows/test_telegram_http.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-01"
  - id: miniapp-webhook-caller
    status: supported
    claim: In the modeled HTTP run, /editor sends an HTTPS web_app button alongside a digest-only one-use browser ticket; replaying the runtime survey final webhook does not duplicate its answer or send another screen.
    reason: Real aiogram serialization and the aiohttp webhook traversed the real Dispatcher, coordinator and PostgreSQL transactions; only Telegram delivery used the existing local stand-in.
    verification: On 2026-11-02, ten tests/modules/ui_flows/test_telegram_http.py cases passed against Postman 1.74.0. The new /editor test checked web_app.url and ticket consumption. The webhook test saved one response and one final event, then replayed the same final update. Its request log contained seven sendMessage and four answerCallbackQuery calls, including the acknowledged replay. No live Telegram or real account was contacted.
    source: tests/modules/ui_flows/test_telegram_http.py; src/manashelper/platform/web/webhook.py; src/manashelper/platform/web/login.py; https://core.telegram.org/bots/api#inlinekeyboardbutton
    updated_at: "2026-11-02"
  - id: pinned-db-text-delivery-caller
    status: supported
    claim: In the modeled HTTP run, runtime menus retain their published DB text release after a newer catalog is published, and expired callback responses format without ambient or file-based user translations.
    reason: The real coordinator and aiogram aiohttp client read committed PostgreSQL snapshots. The test removed its ambient catalog and rejected file translation reads; recorded requests still contained the pinned button label and a localized callback alert.
    verification: On 2026-11-02, all eleven tests/modules/ui_flows/test_telegram_http.py cases passed through the existing local Telegram stand-in. The new test published catalog releases 2 and 3, observed two menus using release 2 and checked persisted delivery pins. It also inspected answerCallbackQuery text after the REQUEST scope closed. No live Telegram or real users were contacted. Fingerprint db-text-catalog-2026-11-02.
    source: tests/modules/ui_flows/test_telegram_http.py::test_real_http_delivery_uses_pinned_db_texts_without_file_translations; src/manashelper/modules/ui_flows/presentation/coordinator.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-02"
  - id: unified-ingress-webhook-caller
    status: supported
    claim: In the modeled unified-ingress webhook path, the caller pins the survey return manifest, records metadata-only admission receipts and does not repeat the final answer or screen on replay.
    reason: The real aiohttp webhook, Dispatcher, resolver, coordinator and PostgreSQL transactions ran together. Only Telegram delivery used the existing local stand-in; persisted receipts, session pins, answers and final events were inspected by the test.
    verification: On 2026-11-02, twelve tests/modules/ui_flows/test_telegram_http.py cases passed through Postman 1.74.0, including both legacy-compatible and unified webhook dispatch. The unified survey produced four ingress receipts, one answer, one final event and a main-menu session pinned to manifest 1. Replaying the final callback added no sendMessage. The simulation log confirmed sendMessage and answerCallbackQuery, plus the modeled failure responses. No live Telegram or real users were contacted. Fingerprint unified-ingress-2026-11-02.
    source: tests/modules/ui_flows/test_telegram_http.py::test_webhook_survey_final_callback_replay_preserves_one_response_and_delivery; tests/modules/ui_flows/test_ingress.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-02"
  - id: rich-screen-delivery-caller
    status: supported
    claim: In the modeled rich-screen path, the caller sends text chunks before media and the primary screen, retains every acknowledged message ID, and never automatically retries a partially delivered inline screen.
    reason: The real aiogram aiohttp client, coordinator and PostgreSQL scopes ran against the local stand-in. The tests inspected multipart serialization, returned album IDs, persisted unknown/sent states and duplicate delivery claims.
    verification: On 2026-11-03, all seventeen tests/modules/ui_flows/test_telegram_http.py cases passed. New cases covered one photo, one video, mixed two-item and ten-item albums, plus a successful mixed album followed by a modeled inline-send HTTP 500. The simulation log confirmed three sendMediaGroup, one sendPhoto and one sendVideo request; the failure case retained prior IDs and issued no retry. This proves caller behavior against the stand-in, not live file validity or client rendering. Fingerprint rich-screen-2026-11-03.
    source: tests/modules/ui_flows/test_telegram_http.py::test_rich_screen_real_http_serialization_ids_and_partial_failure; src/manashelper/modules/ui_flows/presentation/sender.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-03"
  - id: stage7-settings-caller
    status: supported
    claim: In the modeled menu-to-Settings path, the caller sends the runtime Settings screen and does not resend it when the same update is repeated.
    reason: The real aiogram aiohttp client, coordinator and PostgreSQL scopes executed against the local stand-in. The test inspects requests and the persisted runtime location and delivery.
    verification: On 2026-11-03, all seventeen UI-flow HTTP cases passed. The Settings case observed the main menu, reply-keyboard removal and inline Settings message, followed by no additional request on replay. The local stand-in does not establish live Telegram client behavior. Fingerprint stage7-settings-2026-11-03.
    source: tests/modules/ui_flows/test_telegram_http.py::test_real_http_settings_scenario_is_not_repeated; src/manashelper/modules/ui_flows/presentation/coordinator.py; postman/mocks/telegram/default.js
    updated_at: "2026-11-03"
