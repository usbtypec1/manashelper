purpose:
  stands_in_for: Eders Moodle form login, legacy OBIS SSO fallback, course AJAX and read-only pages.
  unblocks: Local verification of direct and fallback Eders authentication without real student credentials.
assumptions:
  - id: direct-moodle-form-login
    status: supported
    claim: The anonymous Eders login page exposes a POST form with anchor, logintoken, username and password.
    reason: These fields and the form action were inspected on the real anonymous login page.
    verification: On 2026-10-29, GET returned HTTP 200; parsed form action was the HTTPS login/index.php URL.
    source: https://eders.manas.edu.kg/login/index.php
    updated_at: "2026-10-29"
  - id: shared-password-success-redirect
    status: unknown
    claim: The configured shared password authenticates each saved student number and returns a page with sesskey.
    reason: The user supplied this contract; no real shared password was available for authenticated verification.
    verification: >-
      On 2026-10-29, the real client passed local simulation tests for form encoding, fresh login token,
      cookies, POST/303/GET redirects, course pagination, details, denied login, missing token, invalid JSON,
      HTTP failure and one whole-snapshot retry after session expiry. Simulation request events confirmed
      GET login/index.php, POST login/index.php (303), GET login/index.php?loginredirect=1 (303),
      GET my/courses.php (200). Full suite on a clean PostgreSQL 18 database: 664 passed, 5 skipped.
      These results establish caller behavior against the stand-in; real successful login remains unverified.
    source: >-
      User-provided login contract; postman/mocks/eders/default.js;
      tests/modules/eders/test_eders_http_flow.py; tests/modules/eders/test_eders_login.py;
      fingerprint eders-direct-login-2026-10-29.
    updated_at: "2026-10-29"
  - id: persisted-snapshots-survive-upstream-failure
    status: supported
    claim: In the local HTTP scenarios, saved OBIS and Eders results can be read without new upstream requests after refresh.
    reason: The application services persist parsed responses in PostgreSQL and cached reads never enter the HTTP clients.
    verification: >-
      On 2026-10-29, tests/modules/eders/test_eders_http_flow.py exercised real HTTP clients against the existing
      stand-in. OBIS credentials, grades and attendance were fetched, saved, and read again without creating
      additional transports. Eders persisted a three-activity snapshot; a later AJAX HTTP 500 failed refresh,
      while reading still returned the previous snapshot without adding requests. Simulation request events
      confirmed the login, course/detail reads and the injected AJAX 500. This proves the local application
      behavior, not successful authentication or response compatibility with real university accounts.
      On 2026-11-04, after extracting the OBIS ResultsSource and SnapshotStore protocols, the focused OBIS,
      snapshot-concurrency and HTTP-flow suite passed all 98 tests against the same repository-owned stand-in.
      Simulation request events confirmed the HTTP dependency path; new boundary tests checked lock/fetch/save
      ordering, account-marker rejection before JSON decoding and legacy snapshot serialization compatibility.
      Fingerprint obis-results-boundaries-2026-11-04. Real university-account compatibility remains unverified.
      Later on 2026-11-04, the OBIS credential and notification-baseline boundaries were extracted as well.
      The OBIS/Eders/concurrency suite passed 276 tests with the same local simulation; one optional HTML-corpus
      test was skipped because the local export was absent. Its 174 request events exercised direct and fallback
      authentication and injected HTTP errors. Credential failure tests retained both previous stored fields,
      and pure comparison tests retained silent baselines, nonempty-grade delivery and attendance increase rules.
      Fingerprint obis-credential-baseline-boundaries-2026-11-04. These findings remain limited to the local stand-in.
      On 2026-11-04, OBIS service facades were replaced by application/use_cases classes with execute entry points
      and read-only queries. The full repository suite passed 806 tests; seven optional corpus/other-simulator tests
      were skipped. The existing stand-in exercised the real HTTP clients through the new credential and refresh
      use cases. A PostgreSQL savepoint test confirmed that an enqueue failure rolls back the snapshot and comparison
      baseline together and a retry still reports the changed grade. Fingerprint obis-use-cases-2026-11-04.
      This preserves local caller behavior and does not establish real university-account compatibility.
    source: >-
      tests/modules/eders/test_eders_http_flow.py;
      tests/modules/obis/test_results_boundaries.py; tests/modules/obis/test_cached_snapshots.py;
      tests/modules/obis/test_credentials_boundaries.py; tests/modules/obis/test_notification_comparison.py;
      src/manashelper/modules/obis/infrastructure/results_source.py;
      postman/mocks/eders/default.js; fingerprints persisted-student-snapshots-2026-10-29,
      obis-results-boundaries-2026-11-04, obis-credential-baseline-boundaries-2026-11-04,
      obis-use-cases-2026-11-04.
    updated_at: "2026-11-04"
  - id: direct-login-obis-fallback-local-scenarios
    status: supported
    claim: In the simulated login failures, Eders tries the Moodle form first and then OBIS SSO using saved credentials.
    reason: Real application services and HTTP clients completed refreshes against the repository-owned stand-in.
    verification: >-
      On 2026-10-30, Eders and OBIS tests passed with the local Postman simulation: 230 passed, 1 skipped.
      Denied form login, missing logintoken, HTTP 503 and a rendered SSO link all reached a three-activity snapshot.
      Request events confirmed the failed direct attempt, OBIS GET/POST site/login, site/eders,
      auth/userkey/login.php, my/index.php with a language parameter and successful Moodle course AJAX.
      Denied OBIS login and an SSO response containing a login form both failed without replacing the saved snapshot.
      Unit tests confirmed that successful direct login and downstream fetch errors do not decrypt the OBIS password.
      Fingerprint eders-obis-fallback-2026-10-30. This establishes local caller behavior only.
    source: >-
      tests/modules/eders/test_eders_http_flow.py; tests/modules/eders/test_cached_snapshots.py;
      tests/modules/eders/test_eders_login.py; postman/mocks/eders/default.js.
    updated_at: "2026-10-30"
  - id: real-obis-sso-availability
    status: unknown
    claim: The real OBIS site/eders endpoint still authenticates students into Eders after a direct Moodle login failure.
    reason: The legacy request sequence was recovered from repository history; no real account was used in this run.
    verification: >-
      On 2026-10-30, simulated redirect and rendered-link variants completed successfully.
      This does not establish current real OBIS or Eders availability, shared-password validity or account eligibility.
      A real authenticated refresh is still needed to verify the upstream services.
    source: >-
      git show 3fe9692^:src/manashelper/modules/eders/infrastructure/client.py;
      postman/mocks/eders/default.js; tests/modules/eders/test_eders_http_flow.py.
    updated_at: "2026-10-30"
  - id: application-use-case-refactor-local-contract
    status: supported
    claim: In the repository-owned HTTP scenarios, extracted Eders and OBIS use cases preserve authentication order, snapshot persistence and failure isolation.
    reason: The real clients and PostgreSQL-backed application ran through the new request-scoped use cases and read-only queries against the existing stand-in.
    verification: >-
      On 2026-11-04, the full repository suite with all four local simulations passed 816 tests; one optional
      Eders HTML-corpus test was skipped because no local export was available. Request events confirmed direct
      Moodle login, OBIS verification/SSO fallback and injected HTTP failures. Regression tests preserved cached
      reads without HTTP, credential atomicity, silent baselines and snapshot/baseline rollback after enqueue failure.
      All 39 use cases resolved in independent Dishka request scopes. This establishes local caller behavior only;
      real university-account compatibility remains unverified. Fingerprint modules-use-cases-2026-11-04.
    source: >-
      tests/modules/eders/test_eders_http_flow.py; tests/modules/obis/test_cached_snapshots.py;
      tests/modules/obis/test_credentials_boundaries.py; tests/test_application_architecture.py;
      postman/mocks/eders/default.js.
    updated_at: "2026-11-04"
  - id: official-transcript-achievement-refresh
    status: supported
    claim: The caller reads the authenticated detailed transcript and derives F1, FF and GPA achievement progress from its semester structure; malformed HTML or an HTTP 500 preserves the previous successful progress.
    reason: The supplied local transcript was parsed without copying personal data into tests. A synthetic fixture with its nested table structure was served through the existing repository-owned OBIS/Eders mock to the real httpx client.
    verification: On 2026-11-04, all 20 HTTP flow tests passed, including two transcript cases. Each used fresh CSRF/login/cookie requests before GET /vs-ders/transkript-detailed, persisted three expected awards in PostgreSQL, then retained prior progress after modeled HTTP/parse failure. No live student login was performed. Final combined suite: 845 passed, 5 unrelated optional tests skipped; fingerprint gamification-webhook-2026-11-04.
    source: tests/modules/eders/test_eders_http_flow.py; tests/fixtures/obis/transcript.html; src/manashelper/modules/obis/infrastructure/transcript_parser.py; postman/mocks/eders/default.js
    updated_at: "2026-11-04"
  - id: opt-in-academic-achievements-local-contract
    status: supported
    claim: In the local HTTP scenarios, opted-in users earn AA and attendance achievements from authenticated OBIS responses, while disabled users skip the transcript fetch and failures preserve prior progress.
    reason: Real HTTP clients, parsers, application use cases and PostgreSQL persistence were exercised against repository-owned synthetic fixtures; no university account was contacted.
    verification: >-
      On 2026-11-05, the full suite passed 850 tests with the existing OBIS/Eders simulation (8 unrelated optional tests skipped).
      The new achievement-progress scenario supplied three AA grades within one semester and five distinct subjects with theory or practice absence at 18.75%.
      The caller stored Eldin balasy and Thin ice together with the existing transcript awards. A later modeled attendance HTTP 500 retained prior progress and awards.
      Before opt-in, the transcript refresh created no HTTP transport. Successful paths included GET /vs-ders/transkript-detailed and GET /vs-ders/taken-lessons after fresh login.
      This proves caller behavior against the stand-in; real OBIS markup and live-account compatibility remain unverified.
      Fingerprint gamification-opt-in-2026-11-05.
    source: tests/modules/eders/test_eders_http_flow.py; tests/fixtures/obis/transcript_achievements.html; tests/fixtures/obis/attendance_achievements.html; postman/mocks/eders/default.js
    updated_at: "2026-11-05"
