<!DOCTYPE html>
<html lang="kg">
<head>
<meta charset="UTF-8">
<meta name="csrf-param" content="_csrf">
<meta name="csrf-token" content="fixture-csrf-token">
</head>
<body>
<form id="w0" action="/site/login" method="post">
<input type="hidden" name="_csrf" value="fixture-csrf-token">
<h4 class="text-center">Системага кирүү</h4>
<div class="mb-3 field-username required">
    <div class="input-group">
        <input type="text" id="username" class="form-control" name="LoginForm[username]" placeholder="Студенттик номер" aria-required="true">
    </div>
    <div class="invalid-feedback"></div>
</div>
<div class="mb-3 field-password required">
    <div class="input-group">
        <input type="password" id="password" class="form-control" name="LoginForm[password_hash]" value="" placeholder="Сырсөз" aria-required="true">
    </div>
    <div class="invalid-feedback"></div>
</div>
<div class="mb-3 field-loginform-verifycode required">
<div class="input-group">
    <span class="input-group-text p-0 bg-white"><img id="loginform-verifycode-image" src="/site/captcha?v=6af55f2dc10ce9.56575628" alt="captcha" title="Жаңылоо үчүн басыңыз" style="cursor: pointer; height: 46px;"></span>
    <input type="text" id="loginform-verifycode" class="form-control" name="LoginForm[verifyCode]" value="" maxlength="6" placeholder="Текшерүү коду" autocomplete="off" aria-required="true">
</div><div class="invalid-feedback">{captcha_error}</div>
</div>
<div class="form-group text-center">
    <button type="submit" class="btn btn-primary btn-lg btn-block login-btn" name="login-button">OK</button>
</div>
</form>
</body>
</html>
