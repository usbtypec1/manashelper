services:

  db:
    image: postgres:18-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "127.0.0.1:${MANASHELPER_DB_HOST_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${MANASHELPER_DATASOURCE_PASSWORD}
      POSTGRES_USER: ${MANASHELPER_DATASOURCE_USERNAME}
      POSTGRES_DB: ${MANASHELPER_DATASOURCE_NAME}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: usbtypec1/manashelper:${MANASHELPER_VERSION}
    container_name: app
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs

  admin:
    image: usbtypec1/manashelper:${MANASHELPER_VERSION}
    profiles: ["admin"]
    restart: always
    env_file:
      - .env
    entrypoint: ["python", "-m", "uvicorn", "manashelper.admin_main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${MANASHELPER_ADMIN_WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/admin/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3

volumes:
  postgres18_data:
  app_logs:
