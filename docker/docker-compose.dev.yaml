services:

  db:
    image: postgres:18-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${MANASHELPER_DATASOURCE_PASSWORD:-pass123}
      POSTGRES_USER: ${MANASHELPER_DATASOURCE_USERNAME:-user123}
      POSTGRES_DB: ${MANASHELPER_DATASOURCE_NAME:-db123}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres18_data:
