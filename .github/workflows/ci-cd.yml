name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user123
          POSTGRES_PASSWORD: pass123
          POSTGRES_DB: db123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user123 -d db123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      MANASHELPER_TELEGRAM_BOT_TOKEN: test-token

      MANASHELPER_DATASOURCE_HOST: localhost
      MANASHELPER_DATASOURCE_NAME: db123
      MANASHELPER_DATASOURCE_USERNAME: user123
      MANASHELPER_DATASOURCE_PASSWORD: pass123

      MANASHELPER_OBIS_ENCRYPTION_KEY: WN99UeaUfixAdP24uN3yBG8Gbbo9hTPf6jlsYrp9KOA=
      MANASHELPER_EDERS_PASSWORD: fake-password

      MANASHELPER_ADVERTISEMENT_CHANNEL_ID: "-1001234567890"
      MANASHELPER_ADVERTISEMENT_CHANNEL_LINK: "https://t.me/manashelper_market"
      MANASHELPER_MODERATION_CHAT_ID: "-1009876543210"
      MANASHELPER_ADMIN_CHAT_ID: "-1001112223334"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile gettext catalogs
        run: uv run pybabel compile -d src/manashelper/locales

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/manashelper

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest


  build:
    needs: test

    # Build main pushes (including merges) and tags like v1.0.0.
    # PRs execute only the test job.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MANASHELPER_VERSION="${GITHUB_REF_NAME#v}"
          else
            MANASHELPER_VERSION="sha-${GITHUB_SHA}"
          fi

          if [ -z "$MANASHELPER_VERSION" ]; then
            echo "Failed to extract version"
            exit 1
          fi

          echo "Version: $MANASHELPER_VERSION"
          echo "version=$MANASHELPER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: usbtypec1
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t usbtypec1/manashelper:${{ steps.version.outputs.version }} \
            -t usbtypec1/manashelper:latest \
            .

      - name: Push Docker images
        run: |
          docker push usbtypec1/manashelper:${{ steps.version.outputs.version }}
          docker push usbtypec1/manashelper:latest


  deploy:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Prepare deployment files on GitHub runner
      # -------------------------------------------------------

      - name: Prepare deployment files
        env:
          MANASHELPER_ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking docker/docker-compose.prod.yaml..."

          if [ ! -f docker/docker-compose.prod.yaml ]; then
            echo "docker/docker-compose.prod.yaml not found"
            exit 1
          fi

          cp docker/docker-compose.prod.yaml docker-compose.yaml

          echo "Checking MANASHELPER_ENV_FILE secret..."

          if [ -z "${MANASHELPER_ENV_FILE:-}" ]; then
            echo "MANASHELPER_ENV_FILE secret is empty"
            exit 1
          fi

          printf '%s\n' "$MANASHELPER_ENV_FILE" > .env
          chmod 600 .env

          if [ ! -s .env ]; then
            echo ".env file was not created or is empty"
            exit 1
          fi

          echo "Deployment files prepared:"
          ls -la docker-compose.yaml .env

      # -------------------------------------------------------
      # Verify SSH before trying SCP
      # -------------------------------------------------------

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          debug: true

          script: |
            set -e

            echo "SSH connection successful"

            echo "User:"
            whoami

            echo "User info:"
            id

            echo "Hostname:"
            hostname

            echo "Docker:"
            docker --version
            docker compose version

            echo "Preparing deployment directory..."

            mkdir -p /opt/manashelper

            if [ ! -w /opt/manashelper ]; then
              echo "/opt/manashelper is not writable"
              ls -ld /opt/manashelper
              exit 1
            fi

            echo "/opt/manashelper permissions:"
            ls -ld /opt/manashelper

      # -------------------------------------------------------
      # Copy compose + env
      # -------------------------------------------------------

      - name: Copy deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          source: "docker-compose.yaml,.env"
          target: "/opt/manashelper"

          overwrite: true
          debug: true

      # -------------------------------------------------------
      # Verify files really arrived
      # -------------------------------------------------------

      - name: Verify deployment files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |
            set -e

            cd /opt/manashelper

            echo "Remote deployment directory:"
            ls -la

            if [ ! -f docker-compose.yaml ]; then
              echo "docker-compose.yaml was not copied"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo ".env was not copied"
              exit 1
            fi

            chmod 600 .env

      # -------------------------------------------------------
      # Deploy
      # -------------------------------------------------------

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |
            set -e

            cd /opt/manashelper

            MANASHELPER_VERSION="${{ needs.build.outputs.version }}"
            export MANASHELPER_VERSION

            echo "Deploying ManasHelper version: ${MANASHELPER_VERSION}"

            echo "Validating docker-compose.yaml..."
            docker compose -f docker-compose.yaml config > /dev/null

            echo "Pulling Docker image..."
            docker pull "usbtypec1/manashelper:${MANASHELPER_VERSION}"

            # An existing PG17 cluster must be restored into PG18 before deployment.
            if docker volume inspect manashelper_postgres_data > /dev/null 2>&1; then
              DB_CONTAINER="$(docker compose -f docker-compose.yaml ps -a -q db)"
              DB_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$DB_CONTAINER" 2>/dev/null || true)"
              if [ "$DB_IMAGE" != "postgres:18-alpine" ]; then
                echo "PostgreSQL 17 data found. Complete docs/postgres-18-upgrade.md before deploying."
                exit 1
              fi
            fi

            echo "Starting containers..."
            docker compose -f docker-compose.yaml up -d --wait --remove-orphans

            echo "Containers:"
            docker compose -f docker-compose.yaml ps

            echo "Removing dangling images..."
            docker image prune -f

            echo "Deployment completed successfully"


  notify:
    needs: [test, build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram summary
        env:
          MANASHELPER_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MANASHELPER_TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MANASHELPER_TEST_RESULT: ${{ needs.test.result }}
          MANASHELPER_BUILD_RESULT: ${{ needs.build.result }}
          MANASHELPER_DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$MANASHELPER_TELEGRAM_BOT_TOKEN" ] || [ -z "$MANASHELPER_TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram summary skipped: set secrets.TELEGRAM_BOT_TOKEN and vars.TELEGRAM_CHAT_ID"
            exit 0
          fi

          status_emoji() {
            case "$1" in
              success) printf '🟢' ;;
              failure) printf '🔴' ;;
              cancelled) printf '🟡' ;;
              *) printf '⚪' ;;
            esac
          }

          printf -v MESSAGE 'Manashelper CI/CD:\n%s Test\n%s Build\n%s Deploy' \
            "$(status_emoji "$MANASHELPER_TEST_RESULT")" \
            "$(status_emoji "$MANASHELPER_BUILD_RESULT")" \
            "$(status_emoji "$MANASHELPER_DEPLOY_RESULT")"

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${MANASHELPER_TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$MANASHELPER_TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MESSAGE" \
            --output /dev/null
