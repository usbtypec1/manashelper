name: CI/CD

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user123
          POSTGRES_PASSWORD: pass123
          POSTGRES_DB: db123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TELEGRAM_BOT_TOKEN: test-token
      DATASOURCE_HOST: localhost
      DATASOURCE_NAME: db123
      DATASOURCE_USERNAME: user123
      DATASOURCE_PASSWORD: pass123
      OBIS_ENCRYPTION_KEY: WN99UeaUfixAdP24uN3yBG8Gbbo9hTPf6jlsYrp9KOA=
      ADVERTISEMENT_CHANNEL_ID: "-1001234567890"
      ADVERTISEMENT_CHANNEL_LINK: "https://t.me/manashelper_market"
      MODERATION_CHAT_ID: "-1009876543210"
      ADMIN_CHAT_ID: "-1001112223334"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile gettext catalogs
        run: uv run pybabel compile -d src/manashelper/locales

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src/manashelper

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  build:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: usbtypec1
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t usbtypec1/manashelper:${{ steps.version.outputs.version }} \
            -t usbtypec1/manashelper:latest .

      - name: Push Docker images
        run: |
          docker push usbtypec1/manashelper:${{ steps.version.outputs.version }}
          docker push usbtypec1/manashelper:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env file for deployment
        run: printf '%s\n' "${{ secrets.ENV_FILE }}" > .env

      - name: Ensure remote deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: mkdir -p /opt/manashelper

      - name: Copy docker-compose.yml and .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "docker-compose.yml,.env"
          target: "/opt/manashelper"
          strip_components: 0

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd /opt/manashelper
            export VERSION=${{ needs.build.outputs.version }}
            docker pull usbtypec1/manashelper:${{ needs.build.outputs.version }}
            docker compose up -d --remove-orphans
            docker image prune -af